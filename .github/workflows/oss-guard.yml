name: OSS Guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  oss-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install package (dev + e2e)
        # 含 e2e extra（playwright/requests）并安装 chromium 浏览器；
        # 否则 tests/e2e/conftest.py 在缺 playwright 时整组 UI 用例静默 skip。
        run: |
          python -m pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium

      - name: Set up pnpm
        # web-src/package.json 固定 packageManager；pnpm-lock.yaml 为 lockfileVersion 9.0
        # （pnpm 9+ 读写同款格式）。仓库实际以 pnpm 11.x 开发，此处固定 11.8.0 与其对齐。
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "11.8.0"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # pnpm 11 需要 Node 22+（Node 20 下 pnpm install --frozen-lockfile
          # 实测报 ERR_UNKNOWN_BUILTIN_MODULE exit 1，勿降回 20）。
          node-version: "22"

      - name: Build frontend (web-src -> src/video_to_summary/web/static)
        working-directory: web-src
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run tests
        # UI e2e 依赖已构建的前端产物（static/index.html 不入库），
        # 因此 pytest 必须放在「构建前端」之后。
        run: python -m pytest -q -m "not live and not network"

      - name: Banned words lint
        run: python scripts/banned_words_lint.py

  desktop-verify:
    name: Desktop ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            lock: windows
            frozen: desktop-dist/VTS
          - runner: macos-15
            target: macos-arm64
            lock: macos
            frozen: desktop-dist/VTS.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/desktop/requirements-${{ matrix.lock }}.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "11.8.0"
      - name: Install locked Python dependencies
        run: |
          python scripts/install_desktop_deps.py "${{ matrix.lock }}"
      - name: Build existing frontend
        working-directory: web-src
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check native architecture
        env:
          TARGET: ${{ matrix.target }}
        run: python -c "import os; from scripts.build_desktop import target_platform; assert target_platform() == os.environ['TARGET']"
      - name: Set up Windows native compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: false
          install: make tar nasm mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .desktop-cache
          key: desktop-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('packaging/desktop/binaries.json', 'packaging/desktop/build_ffmpeg.sh', 'packaging/desktop/requirements-*.lock') }}
      - name: Desktop regression and compilation checks
        run: |
          python -m compileall -q src/video_to_summary/desktop scripts/build_desktop.py scripts/desktop_smoke.py
          python -m pytest -q tests/test_desktop_runtime.py tests/test_desktop_bridge.py tests/test_desktop_media.py tests/test_desktop_packaging.py tests/test_web_tasks_atomicity.py tests/test_crypto.py tests/test_version.py tests/test_windows_no_console.py
      - name: Freeze native application
        run: python scripts/build_desktop.py
      - name: Smoke from frozen application and native WebView
        run: |
          python scripts/desktop_smoke.py "${{ matrix.frozen }}"
          python scripts/desktop_smoke.py "${{ matrix.frozen }}" --gui
      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-diagnostics-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/desktop/metrics.json
            build/desktop/version.json
            build/desktop/freeze/**/warn-*.txt
            .desktop-cache/ffmpeg/**/build.log
