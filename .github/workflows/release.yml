name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release Tag (vMAJOR.MINOR.PATCH or -rc.N)
        required: true
        type: string
      mode:
        description: Build only or upload a verified draft
        required: true
        default: build
        type: choice
        options: [build, draft]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      mode: ${{ steps.version.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Bind strict Tag to source and package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_MODE: ${{ github.event.inputs.mode || 'publish' }}
        run: |
          python scripts/prepare_version.py --tag "$RELEASE_TAG"
          python - <<'PYCODE'
          import json, os
          info = json.load(open('build/desktop/version.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, value in {'tag': info['display'], 'package': info['package'], 'sha': info['sha'], 'prerelease': str(info['prerelease']).lower(), 'mode': os.environ['RELEASE_MODE']}.items():
                  print(f'{name}={value}', file=output)
          PYCODE

  build:
    name: Python packages and installed smoke
    needs: validate-version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
      PACKAGE_VERSION: ${{ needs.validate-version.outputs.package }}
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VTS: ${{ needs.validate-version.outputs.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "11.8.0"
      - name: Build shared frontend
        working-directory: web-src
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Validate source and inject display version
        run: |
          python scripts/prepare_version.py --tag "$RELEASE_TAG"
          python -m pip install -e ".[dev,e2e]" build
          python -m playwright install --with-deps chromium
          python -m pytest -q -m "not live and not network"
          python scripts/banned_words_lint.py
      - name: Build wheel and sdist and verify non-editable installation
        run: |
          python -m build
          python scripts/package_smoke.py --tag "$RELEASE_TAG" --package-version "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-python
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz

  desktop-build:
    name: Installer ${{ matrix.target }}
    needs: [validate-version, build]
    env:
      RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            lock: windows
            frozen: desktop-dist/VTS
          - runner: macos-15
            target: macos-arm64
            lock: macos
            frozen: desktop-dist/VTS.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-version.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/desktop/requirements-${{ matrix.lock }}.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "11.8.0"
      - name: Install locked Python dependencies
        run: |
          python scripts/install_desktop_deps.py "${{ matrix.lock }}"
      - name: Build existing frontend
        working-directory: web-src
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check native architecture
        env:
          TARGET: ${{ matrix.target }}
        run: python -c "import os; from scripts.build_desktop import target_platform; assert target_platform() == os.environ['TARGET']"
      - name: Set up Windows native compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: false
          install: make tar nasm mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .desktop-cache
          key: desktop-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('packaging/desktop/binaries.json', 'packaging/desktop/build_ffmpeg.sh', 'packaging/desktop/requirements-*.lock') }}
      - name: Use the compiler installed by the Action
        if: runner.os == 'Windows'
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python - <<'PYCODE'
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              print('VTS_MSYS2_ROOT=' + os.environ['MSYS2_ROOT'], file=output)
          PYCODE
      - name: Desktop regression and compilation checks
        run: |
          python -m compileall -q src/video_to_summary/desktop scripts/build_desktop.py scripts/desktop_smoke.py
          python -m pytest -q tests/test_desktop_runtime.py tests/test_desktop_bridge.py tests/test_desktop_media.py tests/test_desktop_packaging.py tests/test_web_tasks_atomicity.py tests/test_crypto.py tests/test_version.py tests/test_windows_no_console.py
      - name: Freeze and create installer
        run: python scripts/build_desktop.py --tag "$RELEASE_TAG" --installer
      - name: Smoke from frozen application and native WebView
        run: |
          python scripts/desktop_smoke.py "${{ matrix.frozen }}" --version "$RELEASE_TAG"
          python scripts/desktop_smoke.py "${{ matrix.frozen }}" --version "$RELEASE_TAG" --gui
      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-diagnostics-${{ matrix.target }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/desktop/metrics.json
            build/desktop/version.json
            build/desktop/freeze/**/warn-*.txt
            .desktop-cache/ffmpeg/**/build.log
      - name: Verify installed artifact with native engine
        run: |
          python - <<'PYCODE'
          import glob, os, subprocess, sys
          pattern = 'desktop-dist/*-setup.exe' if sys.platform == 'win32' else 'desktop-dist/*.dmg'
          artifacts = glob.glob(pattern)
          assert len(artifacts) == 1, artifacts
          subprocess.run([sys.executable, 'scripts/desktop_smoke.py', artifacts[0], '--gui', '--version', os.environ['RELEASE_TAG']], check=True)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-desktop-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop-dist/*-setup.exe
            desktop-dist/*.dmg

  assemble:
    name: Verify all four attachments and checksums
    needs: [validate-version, build, desktop-build]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate-version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-version.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release
      - run: python scripts/publish_release.py --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --mode build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release
          retention-days: 14
          if-no-files-found: error
          path: dist-release/*

  release:
    name: Upload verified draft, then publish
    needs: [validate-version, assemble]
    if: needs.validate-version.outputs.mode != 'build'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate-version.outputs.sha }}
      RELEASE_MODE: ${{ needs.validate-version.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-version.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release
          path: dist-release
      - run: python scripts/publish_release.py --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --mode "$RELEASE_MODE"

  docker:
    name: Build and push GHCR image
    needs: [validate-version, release]
    if: needs.validate-version.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-version.outputs.sha }}
      - name: Image tags (prereleases never update latest)
        env:
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          PRERELEASE: ${{ needs.validate-version.outputs.prerelease }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo 'IMAGE_TAGS<<EOF'
            echo "$IMAGE:$RELEASE_TAG"
            if [ "$PRERELEASE" = false ]; then echo "$IMAGE:latest"; fi
            echo EOF
          } >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          build-args: |
            VIDEO_TO_SUMMARY_VERSION=${{ needs.validate-version.outputs.tag }}
            VTS_PACKAGE_VERSION=${{ needs.validate-version.outputs.package }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
